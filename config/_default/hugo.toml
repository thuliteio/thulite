title = "Thulite"
baseurl = "http://localhost/"
disableAliases = true
disableHugoGeneratorInject = true
disableKinds = ["taxonomy", "term"]
enableEmoji = true
enableGitInfo = false
enableRobotsTXT = true
locale = "en-US"
pagerSize = 7
rssLimit = 10
summarylength = 20                  # 70 (default)

copyRight = "Copyright (c) 2020-2026 Thulite"

[build.buildStats]
enable = true

[outputs]
home = ["HTML"]

[sitemap]
changefreq = "monthly"
filename = "sitemap.xml"
priority = 0.5

[taxonomies]
category = "categories"

[permalinks]
blog = "/:title/"

[minify.tdewolff.html]
keepComments = true    # If set to false, build signatures are removed
keepWhitespace = false

[related]
threshold = 80
includeNewer = true
toLower = false
[[related.indices]]
name = "categories"
weight = 100
[[related.indices]]
name = "tags"
weight = 80
[[related.indices]]
name = "date"
weight = 10

[imaging]
anchor = "Center"
resampleFilter = "Lanczos"
